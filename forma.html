<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#080808">
<title>FORMA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#080808;--bg-2:#101010;--surface:#171717;--table:#0D0D0D;--cell-hi:#141414;
  --row-sel:#1a0f0f;--border:#252525;--border-hi:#3a3a3a;
  --text:#F2F2F2;--text-2:#888888;--text-3:#5c5c5c;
  --red:#8B0000;--red-dark:#5C0000;--red-hi:#B22222;
  --red-soft:rgba(139,0,0,.14);--red-glow:rgba(178,34,34,.28);
  --safe-top:env(safe-area-inset-top,0px);--safe-bot:env(safe-area-inset-bottom,0px);
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:Inter,system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
input,select,textarea,button{font-family:inherit;font-size:inherit;color:inherit}
h1,h2,h3,h4{margin:0;font-weight:700;letter-spacing:-.02em}
button{cursor:pointer;border:0;background:none;padding:0}
.num,.mono{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.mono{font-family:var(--mono)}
a{color:inherit;text-decoration:none}
.app{min-height:100vh;display:flex;flex-direction:column}
@media(min-width:900px){.app{display:grid;grid-template-columns:220px 1fr}}
.sidebar{display:none;background:var(--bg-2);border-right:1px solid var(--border);padding:18px 10px;flex-direction:column;height:100vh;position:sticky;top:0;overflow-y:auto}
@media(min-width:900px){.sidebar{display:flex}}
.brand{display:flex;align-items:center;gap:10px;padding:4px 12px 20px;font-weight:800;letter-spacing:.16em;font-size:13px}
.logo{width:26px;height:26px;border-radius:6px;background:var(--red);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);position:relative}
.logo::after{content:"";position:absolute;inset:7px;border-radius:2px;background:var(--bg-2)}
.nav-section{font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.18em;color:var(--text-3);padding:14px 12px 6px}
.nav-item{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:7px;color:var(--text-2);font-size:13px;font-weight:500;cursor:pointer;transition:background .12s,color .12s;position:relative}
.nav-item:hover{background:var(--surface);color:var(--text)}
.nav-item.active{background:var(--red-soft);color:var(--text)}
.nav-item.active::before{content:"";position:absolute;left:-10px;top:50%;transform:translateY(-50%);width:2px;height:16px;background:var(--red-hi)}
.nav-item svg{width:16px;height:16px;opacity:.7;flex-shrink:0}
.nav-item.active svg{opacity:1;color:var(--red-hi)}
.main{padding:16px 14px calc(84px + var(--safe-bot));max-width:100%;width:100%;padding-top:calc(14px + var(--safe-top))}
@media(min-width:900px){.main{padding:24px 28px 40px}}
.mobile-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;padding-top:var(--safe-top)}
@media(min-width:900px){.mobile-top{display:none}}
.mobile-top .brand{padding:0;font-size:11px}
.mobile-top .logo{width:22px;height:22px}
.tabbar{position:fixed;bottom:0;left:0;right:0;z-index:40;background:rgba(8,8,8,.94);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--border);padding-bottom:var(--safe-bot);display:grid;grid-template-columns:repeat(5,1fr)}
@media(min-width:900px){.tabbar{display:none}}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 4px 7px;font-size:9.5px;font-weight:600;color:var(--text-3);transition:color .12s;letter-spacing:.02em}
.tab svg{width:20px;height:20px}
.tab.active{color:var(--red-hi)}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.page-head h1{font-size:22px;font-weight:800;letter-spacing:-.03em}
@media(min-width:900px){.page-head h1{font-size:26px}}
.page-head .sub{font-size:12px;color:var(--text-2);margin-top:2px;font-weight:500}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 12px;border-radius:7px;background:var(--surface);color:var(--text);border:1px solid var(--border);font-size:13px;font-weight:600;transition:background .12s,border-color .12s,transform .05s;white-space:nowrap}
.btn:hover{background:#1e1e1e;border-color:var(--border-hi)}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--red);color:#fff;border-color:var(--red-dark);font-weight:700}
.btn.primary:hover{background:var(--red-hi);border-color:var(--red-hi)}
.btn.ghost{background:transparent}
.btn.ghost:hover{background:var(--surface)}
.btn.danger{color:var(--red-hi);border-color:rgba(178,34,34,.3)}
.btn.sm{padding:5px 9px;font-size:12px;border-radius:6px}
.btn.icon{padding:7px;min-width:32px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:14px}
.card-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.card-hd h2{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.16em;color:var(--text-3)}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:12px 14px}
.stat-label{font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.16em;color:var(--text-3)}
.stat-value{font-size:24px;font-weight:800;letter-spacing:-.03em;margin-top:4px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat-value .unit{font-size:12px;font-weight:600;color:var(--text-2);margin-left:3px;letter-spacing:0}
.stat-sub{font-size:11.5px;color:var(--text-2);margin-top:4px;font-weight:500}
.grid{display:grid;gap:10px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(2,1fr)}
.g4{grid-template-columns:repeat(2,1fr)}
@media(min-width:640px){.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}}
.week-nav{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:10px 12px;margin-bottom:14px}
.week-nav .nav-btn{width:30px;height:30px;border-radius:6px;display:grid;place-items:center;color:var(--text-2);flex-shrink:0;background:var(--bg-2);border:1px solid var(--border)}
.week-nav .nav-btn:hover{background:var(--red-soft);color:var(--red-hi);border-color:var(--red-dark)}
.week-nav .nav-btn:disabled{opacity:.3;cursor:not-allowed}
.week-nav .nav-info{flex:1;text-align:center}
.week-nav .week-label{font-size:13px;font-weight:700}
.week-nav .week-range{font-size:11px;color:var(--text-2);margin-top:1px;font-family:var(--mono)}
.week-block{background:var(--table);border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:18px}
.week-block-header{padding:12px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--bg-2)}
.week-block-header .title{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.16em;color:var(--red-hi)}
.week-block-header .meta{font-size:11px;color:var(--text-2);font-family:var(--mono);display:flex;gap:10px;align-items:center}
.completion-dot{width:6px;height:6px;border-radius:50%;background:var(--border-hi)}
.completion-dot.high{background:var(--red-hi)}
.completion-dot.mid{background:var(--red)}
.completion-dot.low{background:var(--text-3)}
.sheet-wrap{background:var(--table);overflow:hidden}
.sheet-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
.sheet{width:100%;border-collapse:separate;border-spacing:0;font-size:12.5px;font-variant-numeric:tabular-nums}
.sheet th{position:sticky;top:0;z-index:3;background:#0a0a0a;padding:9px 10px;text-align:left;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:var(--text-3);border-bottom:1px solid var(--border);border-right:1px solid var(--border);white-space:nowrap;user-select:none}
.sheet th:last-child{border-right:0}
.sheet th.sticky-col{position:sticky;left:0;z-index:4;background:#0a0a0a}
.sheet td{padding:0;background:var(--table);border-bottom:1px solid var(--border);border-right:1px solid var(--border);vertical-align:middle;position:relative}
.sheet td:last-child{border-right:0}
.sheet tbody tr:hover td{background:var(--cell-hi)}
.sheet tbody tr.row-selected td{background:var(--row-sel)}
.sheet tbody tr.row-selected td.sticky-col{background:var(--row-sel)}
.sheet td.sticky-col{position:sticky;left:0;z-index:2;background:var(--table)}
.sheet tbody tr:hover td.sticky-col{background:var(--cell-hi)}
.sheet tbody tr.row-selected td.sticky-col{background:var(--row-sel)}
.sheet .cell-num{text-align:right}
.sheet .cell-center{text-align:center}
.sheet .cell-input{width:100%;height:100%;padding:8px 10px;background:transparent;border:0;outline:0;color:var(--text);font-size:12.5px;font-family:var(--mono);border-radius:0;min-width:44px}
.sheet .cell-input:focus{background:#1a0505;box-shadow:inset 0 0 0 2px var(--red-hi)}
.sheet .cell-input[type="number"]{-moz-appearance:textfield}
.sheet .cell-input[type="number"]::-webkit-outer-spin-button,
.sheet .cell-input[type="number"]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.sheet .cell-input::placeholder{color:var(--text-3)}
.sheet .cell-text{padding:8px 10px;color:var(--text);white-space:nowrap;font-variant-numeric:tabular-nums}
.sheet .cell-date{padding:8px 10px;font-family:var(--mono);font-size:11.5px;color:var(--text-2);white-space:nowrap}
.sheet .cell-today{color:var(--red-hi);font-weight:700}
.sheet .cell-dayname{font-weight:700;font-size:11.5px;letter-spacing:.02em}
.sheet .empty-cell{color:var(--text-3);font-style:italic;font-family:Inter,sans-serif;font-size:11.5px}
.sheet tr.today-row td{background:#150a0a}
.sheet tr.today-row td.sticky-col{background:#150a0a}
.sheet tr.today-row:hover td{background:#1a0f0f}
.sheet tr.today-row:hover td.sticky-col{background:#1a0f0f}
.week-summary{background:#0a0a0a;border-top:2px solid var(--red-dark);padding:12px 14px}
.week-summary h4{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.16em;color:var(--text-3);margin-bottom:10px}
.summary-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px 16px}
@media(min-width:640px){.summary-grid{grid-template-columns:repeat(4,1fr)}}
.summary-item{display:flex;flex-direction:column;gap:2px;padding:6px 0}
.summary-item .lbl{font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:var(--text-3)}
.summary-item .val{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--text);display:flex;align-items:baseline;gap:4px}
.summary-item .val .unit{font-size:10.5px;font-weight:600;color:var(--text-2)}
.summary-item .val.missing{color:var(--text-3);font-style:italic;font-weight:500;font-size:12px;font-family:Inter,sans-serif}
.summary-item .cov{font-size:9.5px;color:var(--text-3);font-family:var(--mono);font-weight:600}
.summary-item.highlight .val{color:var(--red-hi)}
.field{margin-bottom:12px}
.field label{display:block;font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:var(--text-3);margin-bottom:6px}
input,select,textarea{width:100%;padding:9px 11px;background:var(--bg-2);color:var(--text);border:1px solid var(--border);border-radius:6px;font-size:14px;outline:0;transition:border-color .12s,box-shadow .12s;-webkit-appearance:none;appearance:none}
input:focus,select:focus,textarea:focus{border-color:var(--red-hi);box-shadow:0 0 0 2px var(--red-soft)}
textarea{resize:vertical;min-height:60px;line-height:1.45}
select{background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='11' height='11' viewBox='0 0 24 24' fill='none' stroke='%23888' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpolyline points='6 9 12 15 18 9'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 10px center;padding-right:30px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:480px){.form-grid{grid-template-columns:1fr}}
.modal-bg{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.72);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .15s}
@media(min-width:640px){.modal-bg{align-items:center}}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:14px 14px 0 0;width:100%;max-width:560px;max-height:90vh;overflow-y:auto;padding:10px 18px calc(20px + var(--safe-bot));animation:slideUp .22s cubic-bezier(.4,0,.2,1)}
@media(min-width:640px){.modal{border-radius:10px;padding:18px;max-height:86vh}}
@media(max-width:639px){.modal::before{content:"";display:block;width:32px;height:3px;background:var(--border-hi);border-radius:2px;margin:4px auto 12px}}
.modal h3{font-size:16px;font-weight:700;margin-bottom:14px}
.modal-actions{display:flex;gap:8px;margin-top:16px}
.modal-actions .btn{flex:1;justify-content:center}
@media(min-width:640px){.modal-actions .btn{flex:0 0 auto;min-width:90px}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.toast{position:fixed;left:50%;transform:translateX(-50%) translateY(20px);bottom:calc(76px + var(--safe-bot));background:var(--surface);border:1px solid var(--border-hi);padding:9px 16px;border-radius:7px;font-size:12.5px;font-weight:600;z-index:200;box-shadow:0 10px 40px rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:opacity .15s,transform .15s;max-width:calc(100vw - 32px)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.err{border-color:rgba(178,34,34,.5);color:#ffb0b0}
@media(min-width:900px){.toast{bottom:24px}}
.search-wrap{position:relative}
.search-wrap svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:var(--text-3);pointer-events:none}
.search-wrap input{padding-left:32px}
.empty{padding:30px 16px;text-align:center;color:var(--text-2);font-size:13px}
.empty-icon{width:40px;height:40px;margin:0 auto 10px;border-radius:10px;background:var(--surface);border:1px solid var(--border);display:grid;place-items:center;color:var(--text-3)}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:99px;background:var(--surface);border:1px solid var(--border);font-size:10px;font-weight:700;color:var(--text-2);letter-spacing:.03em}
.chip.red{background:var(--red-soft);border-color:rgba(178,34,34,.35);color:var(--red-hi)}
.chip.dim{color:var(--text-3)}
.insight{padding:11px 13px;border-radius:7px;background:var(--surface);border:1px solid var(--border);margin-bottom:7px;font-size:12.5px;line-height:1.5}
.insight.pos{border-left:2px solid var(--red-hi)}
.insight.warn{border-left:2px solid #8B0000}
.insight.neu{border-left:2px solid var(--border-hi)}
.insight-title{font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.14em;color:var(--text-3);margin-bottom:3px}
.insight-body{color:var(--text-2)}
.insight-body b{color:var(--text);font-weight:700}
.chart{display:flex;align-items:flex-end;gap:3px;height:60px;margin-top:10px}
.chart-bar{flex:1;min-height:3px;border-radius:2px 2px 0 0;background:var(--red);opacity:.7;transition:opacity .15s;cursor:pointer;position:relative}
.chart-bar:hover{opacity:1}
.chart-bar.zero{background:var(--border);opacity:.5}
.kpi-row{display:flex;justify-content:space-between;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--border);font-size:12.5px;gap:12px}
.kpi-row:last-child{border-bottom:0}
.kpi-label{color:var(--text-2)}
.kpi-value{font-weight:600;font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:12.5px;text-align:right;white-space:nowrap}
.kpi-value.muted{color:var(--text-3);font-style:italic;font-family:Inter,sans-serif}
.tabs{display:flex;gap:2px;padding:3px;background:var(--surface);border-radius:7px;border:1px solid var(--border);overflow-x:auto;margin-bottom:14px}
.tab-btn{padding:7px 12px;border-radius:5px;font-size:12px;font-weight:600;color:var(--text-2);white-space:nowrap;transition:all .12s}
.tab-btn.active{background:var(--bg-2);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.5)}
.cal-hdr{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;font-size:9px;text-align:center;color:var(--text-3);font-weight:800;text-transform:uppercase;letter-spacing:.1em;margin-bottom:4px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-day{aspect-ratio:1;border-radius:5px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;font-weight:600;background:var(--table);color:var(--text-3);cursor:pointer;position:relative;transition:all .12s;border:1px solid transparent}
.cal-day:hover{border-color:var(--border-hi)}
.cal-day.full{background:var(--red-soft);color:var(--red-hi);border-color:rgba(178,34,34,.35)}
.cal-day.partial{background:rgba(139,0,0,.06);color:var(--text-2)}
.cal-day.missing{background:var(--table);color:var(--text-3)}
.cal-day.today{box-shadow:inset 0 0 0 1px var(--red-hi)}
.cal-day .num-day{font-size:11.5px;font-weight:700}
.cal-day .dot{width:3px;height:3px;border-radius:50%;background:currentColor;margin-top:1px;opacity:.8}
.corr-badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:99px;background:var(--surface);border:1px solid var(--border);font-size:10.5px;font-weight:700;font-variant-numeric:tabular-nums}
.corr-badge.strong{background:var(--red-soft);border-color:rgba(178,34,34,.35);color:var(--red-hi)}
.corr-badge.weak{border-color:var(--border-hi);color:var(--text-2)}
.corr-badge.none{color:var(--text-3)}
.muscle-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media(min-width:640px){.muscle-grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:900px){.muscle-grid{grid-template-columns:repeat(4,1fr)}}
.muscle-card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px 12px;cursor:pointer;transition:border-color .12s}
.muscle-card:hover{border-color:var(--red-dark)}
.muscle-card .mname{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:var(--text-3);margin-bottom:4px}
.muscle-card .mval{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--text);line-height:1.1}
.muscle-card .mval .unit{font-size:10.5px;color:var(--text-2);font-weight:600;margin-left:2px}
.muscle-card .msub{font-size:10.5px;color:var(--text-2);margin-top:3px;font-variant-numeric:tabular-nums}
.muscle-card.zero .mval{color:var(--text-3);font-style:italic;font-weight:500;font-size:13px}
.delta-up{color:#ff6b8a;font-weight:700}
.delta-down{color:var(--text-2);font-weight:600}
.delta-eq{color:var(--text-3);font-weight:500}
.compare-row{display:grid;grid-template-columns:40px 1fr 1fr 90px;gap:8px;padding:8px 0;border-bottom:1px solid var(--border);align-items:center;font-size:12px}
.compare-row:last-child{border-bottom:0}
.compare-row .c-set{color:var(--text-3);font-family:var(--mono);font-size:11px}
.compare-row .c-prev{color:var(--text-2);font-family:var(--mono);font-size:11.5px}
.compare-row .c-today{color:var(--text);font-family:var(--mono);font-size:11.5px}
.compare-row .c-result{text-align:right;font-size:11px;font-weight:700}
.set-row-edit{display:grid;grid-template-columns:1.3fr .7fr .7fr .7fr auto;gap:6px;margin-bottom:6px;align-items:center}
@media(max-width:520px){.set-row-edit{grid-template-columns:1fr 1fr 1fr;grid-template-areas:"ex ex rm" "wt reps rir"}.set-row-edit .s-ex{grid-area:ex}.set-row-edit .s-wt{grid-area:wt}.set-row-edit .s-reps{grid-area:reps}.set-row-edit .s-rir{grid-area:rir}.set-row-edit .set-rm{grid-area:rm;justify-self:end}}

/* ============================================================
   MUSCLE GROUPS
   ============================================================ */
const MUSCLES=[
  {k:'chest',label:'Chest'},{k:'front_delts',label:'Front delts'},{k:'side_delts',label:'Side delts'},
  {k:'rear_delts',label:'Rear delts'},{k:'lats',label:'Lats'},{k:'upper_back',label:'Upper back'},
  {k:'traps',label:'Traps'},{k:'biceps',label:'Biceps'},{k:'triceps',label:'Triceps'},
  {k:'forearms',label:'Forearms'},{k:'quads',label:'Quadriceps'},{k:'hamstrings',label:'Hamstrings'},
  {k:'glutes',label:'Glutes'},{k:'calves',label:'Calves'},{k:'abs',label:'Abs'}
];
const MUSCLE_LABEL=Object.fromEntries(MUSCLES.map(m=>[m.k,m.label]));

/* ============================================================
   STORAGE + MIGRATION
   ============================================================ */
const KEY='forma.v6';
const OLD_KEYS=['forma.v5','forma.v4','forma.v3','forma.v2','forma.v1'];
const DEFAULT_SETTINGS={
  weightUnit:'kg',lengthUnit:'cm',
  calTarget:2400,proteinTarget:180,carbsTarget:250,fatTarget:70,fiberTarget:30,
  sleepTargetH:8,stepTarget:8000,weeklyWorkoutTarget:4,
  weekStart:1,restTimerSec:90
};
function defaultMusclesFor(name){
  const n=(name||'').toLowerCase();
  const R=[
    {match:/bench|chest press|incline press|decline press|fly|cable fly|pec deck/,primary:['chest'],secondary:[['front_delts',0.5],['triceps',0.5]]},
    {match:/overhead press|military press|ohp|shoulder press|strict press/,primary:['front_delts'],secondary:[['side_delts',0.5],['triceps',0.5]]},
    {match:/lateral raise|side raise|lat raise/,primary:['side_delts'],secondary:[]},
    {match:/rear delt|reverse fly|reverse pec/,primary:['rear_delts'],secondary:[['upper_back',0.5]]},
    {match:/pull.?up|chin.?up|lat pulldown|pulldown/,primary:['lats'],secondary:[['biceps',0.5],['upper_back',0.5]]},
    {match:/row/,primary:['upper_back'],secondary:[['lats',0.5],['biceps',0.5]]},
    {match:/shrug/,primary:['traps'],secondary:[]},
    {match:/curl|bicep/,primary:['biceps'],secondary:[['forearms',0.25]]},
    {match:/tricep|skull|pushdown|extension(?!.*(quad|leg|hamstring))/,primary:['triceps'],secondary:[]},
    {match:/squat|leg press|lunge|hack/,primary:['quads'],secondary:[['glutes',0.5],['hamstrings',0.25]]},
    {match:/deadlift|romanian|rdl|stiff/,primary:['hamstrings'],secondary:[['glutes',0.5],['upper_back',0.5]]},
    {match:/hip thrust|glute bridge|kickback/,primary:['glutes'],secondary:[['hamstrings',0.5]]},
    {match:/calf raise|calves/,primary:['calves'],secondary:[]},
    {match:/crunch|plank|sit.?up|ab |abs|hanging leg/,primary:['abs'],secondary:[]},
    {match:/wrist curl|forearm/,primary:['forearms'],secondary:[]},
    {match:/running|row erg|bike|jump rope|cardio/,primary:[],secondary:[]}
  ];
  for(const r of R){
    if(r.match.test(n))return{primaryMuscles:r.primary,secondaryMuscles:r.secondary.map(([k,w])=>({muscle:k,weight:w})),tertiaryMuscles:[]};
  }
  return{primaryMuscles:[],secondaryMuscles:[],tertiaryMuscles:[]};
}
function migrate(){
  try{
    const v6=JSON.parse(localStorage.getItem(KEY)||'null');
    if(v6){v6.settings={...DEFAULT_SETTINGS,...(v6.settings||{})};v6.dailyMacros??={};v6.sleep??=[];v6.steps??=[];v6.body??=[];v6.exercises??=[];v6.workouts??=[];v6.goals??=[];v6.meals??=[];v6.dailyNotes??={};normalizeExercises(v6);return v6}
  }catch{}
  let old=null;
  for(const k of OLD_KEYS){
    try{const o=JSON.parse(localStorage.getItem(k)||'null');if(o&&(o.exercises||o.workouts||o.body)){old=o;break}}catch{}
  }
  if(old){
    const v6={exercises:old.exercises||[],workouts:old.workouts||[],body:old.body||[],meals:old.meals||[],goals:old.goals||[],sleep:old.sleep||[],steps:old.steps||[],dailyNotes:old.dailyNotes||{},dailyMacros:old.dailyMacros||{},settings:{...DEFAULT_SETTINGS,...(old.settings||{})}};
    if((!v6.dailyMacros||Object.keys(v6.dailyMacros).length===0)&&v6.meals.length>0){
      const byDate={};
      for(const m of v6.meals){if(!m.date)continue;(byDate[m.date]??={p:0,c:0,f:0,fb:0});byDate[m.date].p+=+m.p||0;byDate[m.date].c+=+m.cb||0;byDate[m.date].f+=+m.f||0;byDate[m.date].fb+=+m.fb||0}
      v6.dailyMacros=byDate;
    }
    for(const w of v6.workouts){if(!w.sets)continue;for(const s of w.sets){if(s.rir===undefined)s.rir=null}}
    normalizeExercises(v6);return v6;
  }
  const fresh={exercises:[
    {id:1,name:'Bench Press',category:'strength',muscle:'Chest',createdAt:Date.now()},
    {id:2,name:'Squat',category:'strength',muscle:'Legs',createdAt:Date.now()},
    {id:3,name:'Deadlift',category:'strength',muscle:'Back',createdAt:Date.now()},
    {id:4,name:'Overhead Press',category:'strength',muscle:'Shoulders',createdAt:Date.now()},
    {id:5,name:'Pull-up',category:'strength',muscle:'Back',createdAt:Date.now()}
  ],workouts:[],body:[],meals:[],goals:[],sleep:[],steps:[],dailyNotes:{},dailyMacros:{},settings:{...DEFAULT_SETTINGS}};
  normalizeExercises(fresh);return fresh;
}
function normalizeExercises(db){
  for(const ex of db.exercises||[]){
    if(!ex.primaryMuscles||!Array.isArray(ex.primaryMuscles)){const m=defaultMusclesFor(ex.name);ex.primaryMuscles=m.primaryMuscles;ex.secondaryMuscles=m.secondaryMuscles;ex.tertiaryMuscles=m.tertiaryMuscles}
    if(ex.archived===undefined)ex.archived=false;
  }
}
let DB=migrate();save(DB);
function save(d){try{localStorage.setItem(KEY,JSON.stringify(d))}catch(e){console.error('save failed',e);toast('Save failed — storage may be full',true)}}
let NEXT_ID=Math.max(0,...(DB.exercises||[]).map(x=>+x.id||0),...(DB.workouts||[]).map(x=>+x.id||0),...(DB.body||[]).map(x=>+x.id||0),...(DB.goals||[]).map(x=>+x.id||0),...(DB.sleep||[]).map(x=>+x.id||0),...(DB.steps||[]).map(x=>+x.id||0))+1;
const nid=()=>NEXT_ID++;
const persist=()=>save(DB);

/* ============================================================

   ============================================================ */
const today=()=>new Date().toISOString().slice(0,10);
const daysAgo=n=>{const d=new Date();d.setDate(d.getDate()-n);return d.toISOString().slice(0,10)};
const fmtDate=d=>{if(!d)return '';const dt=new Date(d+'T00:00:00');return dt.toLocaleDateString(undefined,{month:'short',day:'numeric'})};
const fmtDateFull=d=>{if(!d)return '';const dt=new Date(d+'T00:00:00');return dt.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'})};
const relDate=d=>{if(!d)return '';const diff=Math.round((new Date(d+'T00:00:00')-new Date(today()+'T00:00:00'))/864e5);if(diff===0)return 'Today';if(diff===-1)return 'Yesterday';if(diff>0&&diff<7)return `in ${diff}d`;if(diff<0&&diff>-7)return `${-diff}d ago`;return fmtDate(d)};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toast=(m,err)=>{const t=document.getElementById('toast');t.textContent=m;t.className='toast show'+(err?' err':'');clearTimeout(t._t);t._t=setTimeout(()=>t.className='toast',2400)};
const sum=a=>a.reduce((x,y)=>x+(+y||0),0);
const avg=a=>a.length?sum(a)/a.length:null;
const round=(n,d=1)=>n==null?null:Math.round(n*10**d)/10**d;
const wUnit=()=>DB.settings.weightUnit||'kg';
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));

function startOfWeek(dateStr){const d=new Date((dateStr||today())+'T00:00:00');const ws=DB.settings.weekStart??1;const diff=(d.getDay()-ws+7)%7;d.setDate(d.getDate()-diff);return d.toISOString().slice(0,10)}
function endOfWeek(s){const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+6);return d.toISOString().slice(0,10)}
function daysInRange(from,to){const out=[];const d=new Date(from+'T00:00:00');const end=new Date(to+'T00:00:00');while(d<=end){out.push(d.toISOString().slice(0,10));d.setDate(d.getDate()+1)}return out}
function weekDays(startStr){const out=[];const start=new Date(startStr+'T00:00:00');for(let i=0;i<7;i++){const d=new Date(start);d.setDate(start.getDate()+i);out.push(d.toISOString().slice(0,10))}return out}
function shiftWeek(startStr,delta){const d=new Date(startStr+'T00:00:00');d.setDate(d.getDate()+delta*7);return d.toISOString().slice(0,10)}
function weekNumber(startStr){const d=new Date(startStr+'T00:00:00');const target=new Date(d.valueOf());const dayNr=(d.getDay()+6)%7;target.setDate(target.getDate()-dayNr+3);const firstThursday=new Date(target.getFullYear(),0,4);const diff=target.valueOf()-firstThursday.valueOf();return 1+Math.round(diff/(7*864e5))}
function shortDayName(dateStr){return new Date(dateStr+'T00:00:00').toLocaleDateString(undefined,{weekday:'short'})}

function sleepDuration(s){
  if(!s)return null;
  if(s.bed&&s.wake){
    const [bh,bm]=s.bed.split(':').map(Number);const [wh,wm]=s.wake.split(':').map(Number);
    if([bh,bm,wh,wm].some(isNaN))return s.duration||null;
    let mins=(wh*60+wm)-(bh*60+bm);if(mins<=0)mins+=24*60;return round(mins/60,2);
  }
  return s.duration||null;
}
function getDailyMacros(date){return DB.dailyMacros[date]||null}
function setDailyMacros(date,partial){
  const existing=DB.dailyMacros[date]||{p:0,c:0,f:0,fb:0};
  const merged={...existing};
  for(const k of ['p','c','f','fb']){
    if(partial[k]!==undefined){
      if(partial[k]===null||partial[k]===''){delete merged[k]}
      else{const v=parseFloat(partial[k]);if(!isNaN(v))merged[k]=v}
    }
  }
  const hasAny=['p','c','f','fb'].some(k=>merged[k]!==undefined);
  if(!hasAny){delete DB.dailyMacros[date]}else{DB.dailyMacros[date]=merged}
  return hasAny?merged:null;
}
function calcCalories(m){
  if(!m)return null;
  if(m.p===undefined||m.c===undefined||m.f===undefined)return null;
  return Math.round(m.p*4 + m.c*4 + m.f*9);
}
function getDayData(date){
  const weight=(DB.body.find(b=>b.date===date&&b.weight))||null;
  const macros=getDailyMacros(date);
  const sleep=(DB.sleep||[]).find(s=>s.date===date)||null;
  const steps=(DB.steps||[]).find(s=>s.date===date)||null;
  const workouts=DB.workouts.filter(w=>w.date===date);
  return{date,weight,macros,sleep,steps,workouts,calories:calcCalories(macros),sleepDur:sleepDuration(sleep)};
}
function getWeekStats(startStr){
  const dates=weekDays(startStr);const days=dates.map(getDayData);
  const weights=days.filter(d=>d.weight?.weight).map(d=>+d.weight.weight);
  const cals=days.filter(d=>d.calories!=null).map(d=>d.calories);
  const proteins=days.filter(d=>d.macros?.p!==undefined).map(d=>+d.macros.p);
  const carbs=days.filter(d=>d.macros?.c!==undefined).map(d=>+d.macros.c);
  const fats=days.filter(d=>d.macros?.f!==undefined).map(d=>+d.macros.f);
  const fibers=days.filter(d=>d.macros?.fb!==undefined).map(d=>+d.macros.fb);
  const stepsVals=days.filter(d=>d.steps?.count).map(d=>+d.steps.count);
  const sleepVals=days.filter(d=>d.sleepDur!=null).map(d=>d.sleepDur);
  const qualities=days.filter(d=>d.sleep?.quality).map(d=>+d.sleep.quality);
  const trackedDays=days.filter(d=>d.weight||d.calories!=null||d.steps||d.sleepDur!=null).length;
  return{dates,days,
    avgWeight:{value:weights.length?avg(weights):null,n:weights.length},
    avgCalories:{value:cals.length?avg(cals):null,n:cals.length},
    avgProtein:{value:proteins.length?avg(proteins):null,n:proteins.length},
    avgCarbs:{value:carbs.length?avg(carbs):null,n:carbs.length},
    avgFat:{value:fats.length?avg(fats):null,n:fats.length},
    avgFiber:{value:fibers.length?avg(fibers):null,n:fibers.length},
    avgSteps:{value:stepsVals.length?avg(stepsVals):null,n:stepsVals.length},
    totalSteps:sum(stepsVals),
    avgSleep:{value:sleepVals.length?avg(sleepVals):null,n:sleepVals.length},
    avgQuality:{value:qualities.length?avg(qualities):null,n:qualities.length},
    trackedDays,missingDays:7-trackedDays,completionPct:Math.round(trackedDays/7*100)
  };
}
function pearson(xs,ys){
  const n=xs.length;if(n<3)return null;
  const mx=sum(xs)/n,my=sum(ys)/n;
  let num=0,dx2=0,dy2=0;
  for(let i=0;i<n;i++){const dx=xs[i]-mx,dy=ys[i]-my;num+=dx*dy;dx2+=dx*dx;dy2+=dy*dy}
  if(dx2===0||dy2===0)return null;
  return num/Math.sqrt(dx2*dy2);
}
function corrLabel(r){if(r==null)return 'insufficient';const a=Math.abs(r);if(a<0.2)return 'none';if(a<0.4)return 'weak';if(a<0.7)return 'moderate';return 'strong'}

/* ============================================================
   TRAINING ENGINE
   ============================================================ */
const T={
  e1RM(wt,reps){if(!wt||!reps)return null;return round(wt*(1+reps/30),1)},
  previousSessionDate(exId,date){
    let prevDate=null;
    for(const w of DB.workouts){if(w.date>=date)continue;if(!(w.sets||[]).some(s=>s.ex===exId))continue;if(!prevDate||w.date>prevDate)prevDate=w.date}
    return prevDate;
  },
  setsOnDate(exId,date){
    const out=[];
    for(const w of DB.workouts){if(w.date!==date)continue;(w.sets||[]).forEach((s,idx)=>{if(s.ex===exId)out.push({...s,workoutId:w.id,workoutDate:w.date,idx})})}
    return out;
  },
  history(exId){
    const sessions=[];
    for(const w of DB.workouts){
      const sets=(w.sets||[]).filter(s=>s.ex===exId);
      if(!sets.length)continue;
      sessions.push({date:w.date,workoutId:w.id,title:w.title,sets:sets.map(s=>({weight:+s.weight||0,reps:+s.reps||0,rir:s.rir??null}))});
    }
    return sessions.sort((a,b)=>a.date.localeCompare(b.date));
  },
  compareSet(prev,today){
    if(!prev&&!today)return{label:'—',cls:'delta-eq'};
    if(!prev)return{label:'New',cls:'delta-eq'};
    if(!today)return{label:'—',cls:'delta-eq'};
    const dW=(+today.weight||0)-(+prev.weight||0);
    const dR=(+today.reps||0)-(+prev.reps||0);
    const pR=prev.rir==null?null:+prev.rir;
    const tR=today.rir==null?null:+today.rir;
    const dRir=(pR==null||tR==null)?null:tR-pR;
    if(dW>=0&&dR>=0&&(dRir==null||dRir>=0)){
      if(dW>0&&dR>0)return{label:`+${dW}${wUnit()} +${dR}r`,cls:'delta-up'};
      if(dW>0)return{label:`+${dW}${wUnit()}`,cls:'delta-up'};
      if(dR>0)return{label:`+${dR}r`,cls:'delta-up'};
      if(dRir!=null&&dRir>0)return{label:`+${dRir} RIR`,cls:'delta-up'};
      return{label:'=',cls:'delta-eq'};
    }
    if(dW<=0&&dR<=0&&(dRir==null||dRir<=0)){
      if(dW<0||dR<0)return{label:`${dW<0?dW+'kg':''}${dR<0?` ${dR}r`:''}`.trim(),cls:'delta-down'};
      if(dRir!=null&&dRir<0)return{label:`−${Math.abs(dRir)} RIR`,cls:'delta-down'};
      return{label:'=',cls:'delta-eq'};
    }
    if(dR>0&&dRir!=null&&dRir<0)return{label:`+${dR}r, −${Math.abs(dRir)} RIR (trade-off)`,cls:'delta-eq'};
    if(dW>0&&dR<0)return{label:`+${dW}kg, ${dR}r (trade-off)`,cls:'delta-eq'};
    if(dW<0&&dR>0)return{label:`${dW}kg, +${dR}r (trade-off)`,cls:'delta-eq'};
    return{label:`${dW>0?'+':''}${dW}kg ${dR>0?'+':''}${dR}r`,cls:'delta-eq'};
  },
  sessionStats(session){
    if(!session||!session.sets.length)return null;
    const totalVol=sum(session.sets.map(s=>s.weight*s.reps));
    const totalSets=session.sets.length;
    const totalReps=sum(session.sets.map(s=>s.reps));
    const avgWeight=avg(session.sets.map(s=>s.weight));
    const avgReps=avg(session.sets.map(s=>s.reps));
    const rirs=session.sets.filter(s=>s.rir!=null).map(s=>s.rir);
    const avgRir=rirs.length?avg(rirs):null;
    let best=null;
    for(const s of session.sets){const e=this.e1RM(s.weight,s.reps);if(e&&(!best||e>best.e1rm))best={weight:s.weight,reps:s.reps,e1rm:e}}
    return{totalVol,totalSets,totalReps,avgWeight,avgReps,avgRir,best};
  }
};

function computeMuscleVolumeRange(fromDate,toDate){
  const out={};
  for(const m of MUSCLES)out[m.k]={direct:0,indirect:0,total:0,byExercise:{}};
  for(const w of DB.workouts){
    if(w.date<fromDate||w.date>toDate)continue;
    const setsPerEx={};
    for(const s of w.sets||[])setsPerEx[s.ex]=(setsPerEx[s.ex]||0)+1;
    for(const[exId,setCount]of Object.entries(setsPerEx)){
      const ex=DB.exercises.find(e=>e.id===+exId);
      if(!ex)continue;
      for(const pk of ex.primaryMuscles||[]){if(!out[pk])continue;out[pk].direct+=setCount;out[pk].byExercise[ex.name]=(out[pk].byExercise[ex.name]||0)+setCount}
      for(const sm of ex.secondaryMuscles||[]){if(!out[sm.muscle])continue;const c=setCount*(+sm.weight||0.5);out[sm.muscle].indirect+=c;out[sm.muscle].byExercise[ex.name]=(out[sm.muscle].byExercise[ex.name]||0)+c}
      for(const tm of ex.tertiaryMuscles||[]){if(!out[tm.muscle])continue;const c=setCount*(+tm.weight||0.25);out[tm.muscle].indirect+=c;out[tm.muscle].byExercise[ex.name]=(out[tm.muscle].byExercise[ex.name]||0)+c}
    }
  }
  for(const k of Object.keys(out)){out[k].direct=round(out[k].direct,1);out[k].indirect=round(out[k].indirect,1);out[k].total=round(out[k].direct+out[k].indirect,1)}
  return out;
}

const A={
  workoutsIn:(f,t)=>DB.workouts.filter(w=>w.date>=f&&w.date<=t),
  workoutVolume(w){return (w.sets||[]).reduce((s,x)=>s+(+x.reps||0)*(+x.weight||0),0)},
  e1RM(wt,reps){if(!wt||!reps)return null;return round(wt*(1+reps/30),1)},
  prFor(exId){
    let best=null;
    for(const w of DB.workouts){for(const s of w.sets||[]){if(s.ex===exId&&(+s.weight)>0){const e=this.e1RM(+s.weight,+s.reps);if(!best||e>best.e1rm)best={weight:+s.weight,reps:+s.reps,date:w.date,e1rm:e}}}}
    return best;
  },
  newPRsIn(f,t){
    const out=[];
    for(const ex of DB.exercises){
      const hist=T.history(ex.id);if(hist.length<2)continue;
      let maxBefore=0;
      for(const h of hist){const best=h.sets.reduce((b,s)=>{const e=this.e1RM(s.weight,s.reps);return e>(b||0)?e:b},0);if(h.date<f&&best>maxBefore)maxBefore=best}
      for(const h of hist){
        if(h.date>=f&&h.date<=t){
          const best=h.sets.reduce((b,s)=>{const e=this.e1RM(s.weight,s.reps);return e>(b||0)?e:b},0);
          if(best>maxBefore){const bestSet=h.sets.find(s=>this.e1RM(s.weight,s.reps)===best);out.push({exercise:ex.name,date:h.date,weight:bestSet.weight,reps:bestSet.reps,e1rm:best});maxBefore=best}
        }
      }
    }
    return out;
  }
};

function saveDayCell(date,field,rawVal){
  const v=rawVal===''?null:rawVal;
  if(field==='weight'){
    let rec=DB.body.find(b=>b.date===date);
    if(v==null){if(rec)DB.body=DB.body.filter(b=>b!==rec)}
    else{const w=parseFloat(v);if(isNaN(w))return;if(rec)rec.weight=w;else DB.body.push({id:nid(),date,weight:w,createdAt:Date.now()})}
    persist();refreshWeekView(date);return;
  }
  if(field==='steps'){
    let rec=(DB.steps||[]).find(s=>s.date===date);
    if(v==null){if(rec)DB.steps=DB.steps.filter(s=>s!==rec)}
    else{const c=parseInt(v);if(isNaN(c))return;if(rec)rec.count=c;else DB.steps.push({id:nid(),date,count:c,createdAt:Date.now()})}
    persist();refreshWeekView(date);return;
  }
  if(field==='sleepDur'){
    let rec=(DB.sleep||[]).find(s=>s.date===date);
    if(v==null){if(rec){rec.duration=null;if(!rec.bed&&!rec.wake&&!rec.quality)DB.sleep=DB.sleep.filter(s=>s!==rec)}}
    else{const h=parseFloat(v);if(isNaN(h))return;if(!rec){rec={id:nid(),date,createdAt:Date.now()};DB.sleep.push(rec)}rec.duration=h}
    persist();refreshWeekView(date);return;
  }
  if(field==='quality'){
    let rec=(DB.sleep||[]).find(s=>s.date===date);
    if(v==null){if(rec){rec.quality=null;if(!rec.bed&&!rec.wake&&!rec.duration)DB.sleep=DB.sleep.filter(s=>s!==rec)}}
    else{const q=parseInt(v);if(isNaN(q))return;if(!rec){rec={id:nid(),date,createdAt:Date.now()};DB.sleep.push(rec)}rec.quality=q}
    persist();refreshWeekView(date);return;
  }
  if(['p','c','f','fb'].includes(field)){
    const partial={};partial[field]=v;
    setDailyMacros(date,partial);persist();
    const cal=calcCalories(getDailyMacros(date));
    const cell=document.querySelector(`[data-cell="cal-${date}"]`);
    if(cell){
      if(cal==null){cell.innerHTML='<span class="empty-cell">—</span>';cell.style.color='var(--text-3)';cell.style.fontStyle='italic'}
      else{cell.textContent=cal;cell.style.color='var(--text)';cell.style.fontStyle='normal'}
    }
    refreshWeekSummaryOnly();
    return;
  }
}

  const targetWeek=VIEW_ARGS.weekStart||startOfWeek(date);

function refreshWeekSummaryOnly(){
  const cur=VIEW_ARGS.weekStart||startOfWeek(today());
  const stats=getWeekStats(cur);
  const grid=document.querySelector('.summary-grid');
  if(!grid)return;
  const items=[['Avg weight','avgWeight',v=>v.toFixed(1)+`<span class="unit">${wUnit()}</span>`,'highlight'],['Avg calories','avgCalories',v=>Math.round(v)+'<span class="unit">kcal</span>',''],['Avg protein','avgProtein',v=>Math.round(v)+'<span class="unit">g</span>',''],['Avg carbs','avgCarbs',v=>Math.round(v)+'<span class="unit">g</span>',''],['Avg fat','avgFat',v=>Math.round(v)+'<span class="unit">g</span>',''],['Avg fiber','avgFiber',v=>Math.round(v)+'<span class="unit">g</span>',''],['Avg steps','avgSteps',v=>Math.round(v).toLocaleString(),''],['Avg sleep','avgSleep',v=>{const h=Math.floor(v);const m=Math.round((v-h)*60);return `${h}<span class="unit">h</span> ${m}<span class="unit">m</span>`},''],['Avg quality','avgQuality',v=>v.toFixed(1)+'<span class="unit">/10</span>',''],['Total steps','totalSteps',v=>Math.round(v).toLocaleString(),''],['Tracked','trackedDays',v=>v+'<span class="unit">/7</span>',''],['Missing','missingDays',v=>v+'<span class="unit">days</span>','']];
  grid.innerHTML=items.map(([lbl,key,fn,cls])=>{
    const s=stats[key];const isObj=s&&typeof s==='object';const val=isObj?s.value:s;const cov=isObj?s.n:null;
    let valHtml;
    if(val==null||(typeof val==='number'&&isNaN(val)))valHtml=`<span class="val missing">no data</span>`;
    else if(key==='totalSteps'||key==='trackedDays'||key==='missingDays')valHtml=`<span class="val ${cls}">${fn(val)}</span>`;
    else valHtml=`<span class="val ${cls}">${fn(val)}</span>${cov!=null?`<span class="cov">${cov}/7 days</span>`:''}`;
    return `<div class="summary-item ${cls}"><span class="lbl">${lbl}</span>${valHtml}</div>`;
  }).join('');
}

views.workouts=()=>{
  const filterEx=VIEW_ARGS.exercise||'all';

  let rows=[];
  for(const w of DB.workouts.slice().sort((a,b)=>b.date.localeCompare(a.date))){
    (w.sets||[]).forEach((s,idx)=>{
      const ex=DB.exercises.find(e=>e.id===s.ex);
      const prevExDate=T.previousSessionDate(s.ex,w.date);
      const prevSets=prevExDate?T.setsOnDate(s.ex,prevExDate):[];
      const prevSet=prevSets[idx]||prevSets[prevSets.length-1]||null;
      const pr=A.prFor(s.ex);
      const isPR=pr&&pr.date===w.date&&pr.weight===+s.weight&&pr.reps===+s.reps;
      const cmp=prevSet?T.compareSet(prevSet,s):{label:'—',cls:'delta-eq'};
      rows.push({workout:w,workoutId:w.id,exercise:ex,exId:s.ex,setIndex:idx,set:s,prevSet,prevDate:prevExDate,isPR,cmp});
    });

            <td class="cell-center"><div class="cell-text">${r.setIndex+1}</div></td>
            <td class="cell-num"><input class="cell-input" type="number" step="0.5" value="${r.set.weight||''}" data-set-field="weight" data-wid="${r.workoutId}" data-sidx="${r.setIndex}" placeholder="—"></td>

            <td class="cell-num"><input class="cell-input" type="number" step="1" min="0" max="5" value="${r.set.rir??''}" data-set-field="rir" data-wid="${r.workoutId}" data-sidx="${r.setIndex}" placeholder="—"></td>

    inp.addEventListener('change',()=>{

      const w=DB.workouts.find(x=>x.id===wid);if(!w)return;
      const s=w.sets[sidx];if(!s)return;
      if(field==='rir'){s.rir=inp.value===''?null:parseInt(inp.value)}
      else{s[field]=inp.value===''?null:parseFloat(inp.value)}
      persist();
      clearTimeout(window._wkT);window._wkT=setTimeout(()=>views.workouts(),500);
    });
  });
  const s=document.getElementById('wk-search');if(s)s.oninput=e=>{window._wkSearch=e.target.value;views.workouts()};

function delSet(wid,sidx){
  const w=DB.workouts.find(x=>x.id===wid);if(!w)return;
  if(!confirm('Delete this set?'))return;
  w.sets.splice(sidx,1);
  if(w.sets.length===0){if(confirm('Delete the whole workout?'))DB.workouts=DB.workouts.filter(x=>x.id!==wid)}
  persist();toast('Deleted');views.workouts();
}

      <div style="margin-top:12px;padding-top:10px;border-top:1px solid var(--border);font-size:11.5px;color:var(--text-2)">Volume: ${Math.round(prev.totalVol)} → ${Math.round(latest.totalVol)} ${wUnit()} (<span class="${latest.totalVol-prev.totalVol>=0?'delta-up':'delta-down'}">${latest.totalVol-prev.totalVol>=0?'+':''}${Math.round(latest.totalVol-prev.totalVol)}</span>) · Best e1RM: ${prev.best?prev.best.e1rm:'—'} → ${latest.best?latest.best.e1rm:'—'}</div>

      <div class="chart">${sessions.map(s=>{const v=s.best?s.best.e1rm:0;const h=v/maxE*100;return `<div class="chart-bar" style="height:${Math.max(4,h)}%" title="${s.date}: ${v}"></div>`}).join('')}</div>

  `);
  m.querySelectorAll('[data-secondary]').forEach(cb=>{cb.onchange=()=>{const inp=m.querySelector(`[data-weight="${cb.dataset.secondary}"]`);if(inp)inp.disabled=!cb.checked}});
  m.querySelectorAll('[data-tertiary]').forEach(cb=>{cb.onchange=()=>{const inp=m.querySelector(`[data-tweight="${cb.dataset.tertiary}"]`);if(inp)inp.disabled=!cb.checked}});
  m.querySelector('#save').onclick=()=>{
    const primary=[...m.querySelectorAll('[data-primary]:checked')].map(cb=>cb.dataset.primary);
    const secondary=[];
    m.querySelectorAll('[data-secondary]').forEach(cb=>{if(cb.checked)secondary.push({muscle:cb.dataset.secondary,weight:parseFloat(m.querySelector(`[data-weight="${cb.dataset.secondary}"]`).value)||0.5})});
    const tertiary=[];
    m.querySelectorAll('[data-tertiary]').forEach(cb=>{if(cb.checked)tertiary.push({muscle:cb.dataset.tertiary,weight:parseFloat(m.querySelector(`[data-tweight="${cb.dataset.tertiary}"]`).value)||0.25})});
    ex.primaryMuscles=primary;ex.secondaryMuscles=secondary;ex.tertiaryMuscles=tertiary;
    persist();closeModal(m);toast('Saved');views.exercise_detail();
  };
}

views.muscle_detail=()=>{
  const muscle=VIEW_ARGS.muscle;

  const weekStartStr=VIEW_ARGS.weekStart||startOfWeek(today());
  let startDate,endDate,label;
  if(mode==='week'){startDate=weekStartStr;endDate=endOfWeek(weekStartStr);label=`Week ${weekNumber(startDate)}`}

  else{startDate=shiftWeek(startOfWeek(today()),-7);endDate=endOfWeek(startOfWeek(today()));label='Last 8 weeks'}
  const vol=computeMuscleVolumeRange(startDate,endDate);
  const current=vol[muscle]||{direct:0,indirect:0,total:0,byExercise:{}};
  let prevStart,prevEnd;
  if(mode==='week'){prevStart=shiftWeek(startDate,-1);prevEnd=endOfWeek(prevStart)}

  else{prevStart=shiftWeek(startDate,-8);prevEnd=endOfWeek(shiftWeek(startDate,-1))}
  const prevVol=computeMuscleVolumeRange(prevStart,prevEnd);
  const prev=prevVol[muscle]||{direct:0,indirect:0,total:0,byExercise:{}};
  const pctChange=prev.total>0?round((current.total-prev.total)/prev.total*100,0):null;

      <div class="stat"><div class="stat-label">Total</div><div class="stat-value" style="color:var(--red-hi)">${current.total}</div></div>
      <div class="stat"><div class="stat-label">vs Previous</div><div class="stat-value">${pctChange!=null?(pctChange>0?'+':'')+pctChange+'%':'—'}</div></div>
    </div>
    <div class="card" style="margin-bottom:12px"><div class="card-hd"><h2>Contributing exercises</h2></div>

  document.getElementById('view').innerHTML=`

    <div class="grid g4" style="margin-bottom:14px">
      <div class="stat"><div class="stat-label">7d avg</div><div class="stat-value">${wkStats.avgSleep.value!=null?wkStats.avgSleep.value.toFixed(1):'—'}${wkStats.avgSleep.value!=null?'<span class="unit">h</span>':''}</div></div>
      <div class="stat"><div class="stat-label">Quality</div><div class="stat-value">${wkStats.avgQuality.value!=null?wkStats.avgQuality.value.toFixed(1):'—'}</div></div>
      <div class="stat"><div class="stat-label">Target</div><div class="stat-value">${DB.settings.sleepTargetH}<span class="unit">h</span></div></div>
      <div class="stat"><div class="stat-label">Tracked</div><div class="stat-value">${wkStats.avgSleep.n}<span class="unit">/7</span></div></div>
    </div>
    <div class="sheet-wrap"><div class="sheet-scroll"><table class="sheet">
      <thead><tr><th class="sticky-col">Date</th><th class="cell-center">Bed</th><th class="cell-center">Wake</th><th class="cell-num">Duration</th><th class="cell-num">Quality</th><th></th></tr></thead>
      <tbody>${days.map(d=>{const rec=(DB.sleep||[]).find(s=>s.date===d);const dur=sleepDuration(rec);return `<tr>
        <td class="sticky-col"><div class="cell-date ${d===today()?'cell-today':''}">${fmtDate(d)}</div></td>

        <td class="cell-center"><input class="cell-input" type="time" value="${rec?.wake||''}" data-sf="wake" data-date="${d}"></td>
        <td class="cell-num"><div class="cell-text">${dur!=null?dur.toFixed(1)+'h':'—'}</div></td>

        <td class="cell-center">${rec?`<button class="row-del" onclick="delSleep('${d}')" style="width:26px;height:26px">${IC.trash}</button>`:''}</td>
      </tr>`}).join('')}</tbody>
    </table></div></div>
  `;
  document.querySelectorAll('[data-sf]').forEach(inp=>{
    inp.addEventListener('change',()=>{

function renderWeeklyReport(){
  const weeks=[];

  const sel=VIEW_ARGS.weekStart||weeks[0];
  const cur=getWeekStats(sel);
  const prev=getWeekStats(shiftWeek(sel,-1));
  const muscleVol=computeMuscleVolumeRange(sel,endOfWeek(sel));
  const topMuscles=Object.entries(muscleVol).map(([k,v])=>({k,v})).filter(x=>x.v.total>0).sort((a,b)=>b.v.total-a.v.total).slice(0,6);
  document.getElementById('report-body').innerHTML=`
    <div class="card" style="margin-bottom:12px"><div class="field"><label>Week</label><select onchange="go('reports',{mode:'weekly',weekStart:this.value})">${weeks.map(w=>`<option value="${w}" ${w===sel?'selected':''}>Week ${weekNumber(w)} · ${fmtDate(w)} – ${fmtDate(endOfWeek(w))}</option>`).join('')}</select></div></div>
    <div class="grid g2" style="margin-bottom:12px">
      <div class="card"><div class="card-hd"><h2>Body</h2></div><div class="kpi-row"><span class="kpi-label">Avg weight</span><span class="kpi-value ${cur.avgWeight.value==null?'muted':''}">${cur.avgWeight.value!=null?cur.avgWeight.value.toFixed(1)+' '+wUnit():'—'} <span style="color:var(--text-3);font-size:10px">n=${cur.avgWeight.n}</span></span></div><div class="kpi-row"><span class="kpi-label">Avg sleep</span><span class="kpi-value">${cur.avgSleep.value!=null?cur.avgSleep.value.toFixed(1)+'h':'—'}</span></div></div>
      <div class="card"><div class="card-hd"><h2>Completion</h2></div><div class="kpi-row"><span class="kpi-label">Tracked</span><span class="kpi-value">${cur.trackedDays}/7</span></div><div class="kpi-row"><span class="kpi-label">Completion</span><span class="kpi-value">${cur.completionPct}%</span></div></div>
    </div>
    <div class="card" style="margin-bottom:12px"><div class="card-hd"><h2>Nutrition</h2></div><table class="sheet" style="width:100%;border:1px solid var(--border);border-radius:6px;overflow:hidden"><thead><tr><th>Metric</th><th class="cell-num">This</th><th class="cell-num">Prev</th><th class="cell-num">Δ</th></tr></thead><tbody>${[['Calories','avgCalories',v=>Math.round(v)],['Protein','avgProtein',v=>Math.round(v)+'g'],['Carbs','avgCarbs',v=>Math.round(v)+'g'],['Fat','avgFat',v=>Math.round(v)+'g'],['Fiber','avgFiber',v=>Math.round(v)+'g']].map(([lbl,key,fn])=>{const c=cur[key],p=prev[key];let delta='—';if(c.value!=null&&p.value!=null){const d=c.value-p.value;delta=`<span style="color:${d<0?'var(--red-hi)':'var(--text)'}">${d>0?'+':''}${Math.round(d)}</span>`}return `<tr><td><div class="cell-text">${lbl}</div></td><td class="cell-num"><div class="cell-text">${c.value!=null?fn(c.value):'—'}</div></td><td class="cell-num"><div class="cell-text">${p.value!=null?fn(p.value):'—'}</div></td><td class="cell-num"><div class="cell-text">${delta}</div></td></tr>`}).join('')}</tbody></table></div>
    ${topMuscles.length?`<div class="card"><div class="card-hd"><h2>Top muscle groups</h2></div>${topMuscles.map(m=>`<div class="kpi-row"><span class="kpi-label">${MUSCLE_LABEL[m.k]}</span><span class="kpi-value">${m.v.direct} direct + ${m.v.indirect}</span></div>`).join('')}</div>`:''}
  `;
}
function renderMonthlyReport(){
  const months=[];const now=new Date();
  for(let i=0;i<12;i++){const d=new Date(now.getFullYear(),now.getMonth()-i,1);months.push({y:d.getFullYear(),m:d.getMonth()+1,label:d.toLocaleDateString(undefined,{month:'long',year:'numeric'})})}
  const sel=VIEW_ARGS.month||`${months[0].y}-${months[0].m}`;
  const [y,mo]=sel.split('-').map(Number);
  const from=`${y}-${String(mo).padStart(2,'0')}-01`;
  const lastDay=new Date(y,mo,0).getDate();
  const to=`${y}-${String(mo).padStart(2,'0')}-${lastDay}`;
  const days=daysInRange(from,to).map(getDayData);
  const weights=days.filter(d=>d.weight?.weight).map(d=>+d.weight.weight);
  const cals=days.filter(d=>d.calories!=null).map(d=>d.calories);
  const sleep=days.filter(d=>d.sleepDur!=null).map(d=>d.sleepDur);
  const workouts=A.workoutsIn(from,to);
  const prs=A.newPRsIn(from,to);
  const muscleVol=computeMuscleVolumeRange(from,to);
  document.getElementById('report-body').innerHTML=`
    <div class="card" style="margin-bottom:12px"><div class="field"><label>Month</label><select onchange="go('reports',{mode:'monthly',month:this.value})">${months.map(x=>`<option value="${x.y}-${x.m}" ${sel===`${x.y}-${x.m}`?'selected':''}>${x.label}</option>`).join('')}</select></div></div>
    <div class="card" style="margin-bottom:12px"><div class="card-hd"><h2>${months.find(x=>`${x.y}-${x.m}`===sel)?.label||sel}</h2></div>
      <div class="kpi-row"><span class="kpi-label">Avg weight</span><span class="kpi-value ${weights.length?'':'muted'}">${weights.length?avg(weights).toFixed(1)+' '+wUnit():'no data'}</span></div>
      <div class="kpi-row"><span class="kpi-label">Avg calories</span><span class="kpi-value ${cals.length?'':'muted'}">${cals.length?Math.round(avg(cals)):'no data'}</span></div>
      <div class="kpi-row"><span class="kpi-label">Avg sleep</span><span class="kpi-value">${sleep.length?avg(sleep).toFixed(1)+'h':'—'}</span></div>
      <div class="kpi-row"><span class="kpi-label">Workouts</span><span class="kpi-value">${workouts.length}</span></div>
      <div class="kpi-row"><span class="kpi-label">New PRs</span><span class="kpi-value">${prs.length}</span></div>
    </div>
    <div class="card"><div class="card-hd"><h2>Muscle volume</h2></div>${Object.entries(muscleVol).filter(([k,v])=>v.total>0).sort((a,b)=>b[1].total-a[1].total).map(([k,v])=>`<div class="kpi-row"><span class="kpi-label">${MUSCLE_LABEL[k]}</span><span class="kpi-value">${v.direct} + ${v.indirect}</span></div>`).join('')||'<div class="empty">No workouts.</div>'}</div>
  `;
}

views.analytics=()=>{
  const days=daysInRange(daysAgo(59),today());
  const rows=days.map(d=>{const day=getDayData(d);const wkt=DB.workouts.find(w=>w.date===d);return{date:d,sleepH:day.sleepDur,quality:day.sleep?.quality||null,cal:day.calories,vol:wkt?A.workoutVolume(wkt):null,steps:day.steps?.count??null,weight:day.weight?.weight??null}});
  function corr(a,b){const p=rows.filter(r=>r[a]!=null&&r[b]!=null);if(p.length<5)return{n:p.length,r:null};return{n:p.length,r:pearson(p.map(x=>x[a]),p.map(x=>x[b]))}}
  const analyses=[{label:'Sleep ↔ Volume',a:'sleepH',b:'vol'},{label:'Calories ↔ Volume',a:'cal',b:'vol'},{label:'Steps ↔ Weight',a:'steps',b:'weight'},{label:'Sleep ↔ Steps',a:'sleepH',b:'steps'}];
  document.getElementById('view').innerHTML=`
    <div class="page-head"><div><h1>Analytics</h1><div class="sub">Last 60 days</div></div></div>
    <div class="card"><div class="card-hd"><h2>Correlations</h2></div>
      ${analyses.map(x=>{const c=corr(x.a,x.b);return `<div class="kpi-row"><span class="kpi-label">${x.label}</span><div style="display:flex;gap:6px;align-items:center">${c.r!=null?`<span class="corr-badge ${Math.abs(c.r)>=0.4?'strong':Math.abs(c.r)>=0.2?'weak':'none'}">r=${c.r.toFixed(2)} · ${corrLabel(c.r)}</span>`:`<span class="corr-badge none">insufficient</span>`}<span style="font-size:10px;color:var(--text-3)">n=${c.n}</span></div></div>`}).join('')}
      <div style="font-size:11px;color:var(--text-3);margin-top:12px;line-height:1.55">Correlation ≠ causation.</div>
    </div>
  `;
};

views.calendar=()=>{
  const ref=VIEW_ARGS.month||today().slice(0,7);
  const [y,m]=ref.split('-').map(Number);
  const firstDay=new Date(y,m-1,1);
  const lastDay=new Date(y,m,0).getDate();
  const ws=DB.settings.weekStart??1;
  const startPad=(firstDay.getDay()-ws+7)%7;
  const dayNames=ws===1?['Mo','Tu','We','Th','Fr','Sa','Su']:['Su','Mo','Tu','We','Th','Fr','Sa'];
  const selDate=VIEW_ARGS.day;
  const cells=[];
  for(let i=0;i<startPad;i++)cells.push(null);
  for(let d=1;d<=lastDay;d++){
    const date=`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const day=getDayData(date);
    const cnt=[day.weight,day.calories,day.steps,day.sleepDur,day.workouts.length].filter(Boolean).length;
    let cls='cal-day';
    if(cnt>=4)cls+=' full';else if(cnt>=2)cls+=' partial';else if(cnt===0&&date<today())cls+=' missing';
    if(date===today())cls+=' today';
    cells.push({date,d,cnt,cls});
  }
  document.getElementById('view').innerHTML=`
    <div class="page-head"><div><h1>Calendar</h1><div class="sub">${new Date(y,m-1).toLocaleDateString(undefined,{month:'long',year:'numeric'})}</div></div></div>
    <div class="card" style="margin-bottom:12px"><div class="cal-hdr">${dayNames.map(d=>`<div>${d}</div>`).join('')}</div><div class="cal-grid">${cells.map(c=>c?`<div class="${c.cls}" onclick="go('calendar',{month:'${ref}',day:'${c.date}'})"><div class="num-day">${c.d}</div>${c.cnt>0?'<div class="dot"></div>':''}</div>`:`<div></div>`).join('')}</div></div>
    ${selDate?(()=>{const d=getDayData(selDate);return `<div class="card"><div class="card-hd"><h2>${fmtDateFull(selDate)}</h2></div><div class="kpi-row"><span class="kpi-label">Weight</span><span class="kpi-value">${d.weight?d.weight.weight+' '+wUnit():'—'}</span></div><div class="kpi-row"><span class="kpi-label">Calories</span><span class="kpi-value">${d.calories!=null?d.calories+' kcal':'—'}</span></div><div class="kpi-row"><span class="kpi-label">Steps</span><span class="kpi-value">${d.steps?d.steps.count.toLocaleString():'—'}</span></div><div class="kpi-row"><span class="kpi-label">Sleep</span><span class="kpi-value">${d.sleepDur!=null?d.sleepDur.toFixed(1)+'h':'—'}</span></div></div>`})():''}
  `;
};

    <div class="page-head"><div><h1>Records</h1><div class="sub">${allPRs.length} exercises</div></div></div>
    ${recent.length?`<div class="card" style="margin-bottom:12px"><div class="card-hd"><h2 style="color:var(--red-hi)">Recent</h2></div>${recent.map(p=>`<div class="kpi-row"><span class="kpi-label">${esc(p.exercise)}</span><span class="kpi-value">${p.weight}${wUnit()} × ${p.reps}</span></div>`).join('')}</div>`:''}
    ${allPRs.length?`<div class="sheet-wrap"><table class="sheet"><thead><tr><th>Exercise</th><th class="cell-num">Weight</th><th class="cell-num">Reps</th><th class="cell-num">e1RM</th><th>Date</th></tr></thead><tbody>${allPRs.sort((a,b)=>b.pr.e1rm-a.pr.e1rm).map(x=>`<tr><td><div class="cell-text"><a href="#" onclick="event.preventDefault();openExerciseDetail(${x.ex.id})" style="color:var(--text)">${esc(x.ex.name)}</a></div></td><td class="cell-num"><div class="cell-text">${x.pr.weight}</div></td><td class="cell-num"><div class="cell-text">${x.pr.reps}</div></td><td class="cell-num"><div class="cell-text" style="color:var(--red-hi);font-weight:700">${x.pr.e1rm}</div></td><td><div class="cell-date">${fmtDate(x.pr.date)}</div></td></tr>`).join('')}</tbody></table></div>`:`<div class="card"><div class="empty">No PRs yet.</div></div>`}
  `;
};

views.archive=()=>{
  const meals=DB.meals||[];
  const byDate={};
  for(const m of meals){if(!m.date)continue;(byDate[m.date]??=[]).push(m)}
  const dates=Object.keys(byDate).sort().reverse();
  document.getElementById('view').innerHTML=`
    <div class="page-head"><div><h1>Meal archive</h1><div class="sub">${meals.length}</div></div></div>
    ${dates.length?dates.slice(0,60).map(d=>`<div class="card" style="margin-bottom:8px"><div class="card-hd"><h2>${fmtDateFull(d)}</h2><span class="chip">${byDate[d].length}</span></div>${byDate[d].map(m=>`<div class="kpi-row"><span class="kpi-label">${esc(m.name)}</span><span class="kpi-value">${Math.round(m.cal||0)} kcal</span></div>`).join('')}</div>`).join(''):`<div class="card"><div class="empty">No archived meals.</div></div>`}
  `;
};

views.settings=()=>{
  const s=DB.settings;
  document.getElementById('view').innerHTML=`
    <div class="page-head"><h1>Data & settings</h1></div>
    <div class="card" style="margin-bottom:12px"><div class="card-hd"><h2>Units</h2></div><div class="form-grid"><div class="field"><label>Weight</label><select id="s-wu"><option value="kg" ${s.weightUnit==='kg'?'selected':''}>kg</option><option value="lb" ${s.weightUnit==='lb'?'selected':''}>lb</option></select></div><div class="field"><label>Week starts</label><select id="s-ws"><option value="1" ${s.weekStart===1?'selected':''}>Monday</option><option value="0" ${s.weekStart===0?'selected':''}>Sunday</option></select></div></div></div>
    <div class="card" style="margin-bottom:12px"><div class="card-hd"><h2>Targets</h2></div><div class="form-grid"><div class="field"><label>Protein</label><input id="s-p" type="number" value="${s.proteinTarget}"></div><div class="field"><label>Carbs</label><input id="s-cb" type="number" value="${s.carbsTarget}"></div><div class="field"><label>Fat</label><input id="s-f" type="number" value="${s.fatTarget}"></div><div class="field"><label>Fiber</label><input id="s-fb" type="number" value="${s.fiberTarget}"></div><div class="field"><label>Sleep (h)</label><input id="s-sl" type="number" step="0.5" value="${s.sleepTargetH}"></div><div class="field"><label>Steps</label><input id="s-st" type="number" value="${s.stepTarget}"></div><div class="field"><label>Workouts/week</label><input id="s-ww" type="number" value="${s.weeklyWorkoutTarget}"></div></div><button class="btn primary" onclick="saveSettings()">${IC.check}Save</button></div>
    <div class="card" style="margin-bottom:12px"><div class="card-hd"><h2>Backup</h2></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" onclick="exportJSON()">${IC.download}Export JSON</button><label class="btn" style="cursor:pointer">${IC.upload}Import<input type="file" accept=".json" onchange="importJSON(event)" style="display:none"></label></div></div>
    <div class="card" style="border-color:rgba(178,34,34,.25)"><div class="card-hd"><h2 style="color:var(--red-hi)">Danger</h2></div><button class="btn danger" onclick="resetAll()">${IC.trash}Reset all data</button></div>
    <div style="text-align:center;padding:24px 0;font-size:10px;color:var(--text-3);letter-spacing:.1em">FORMA v6.1 · ${DB.workouts.length} workouts · ${DB.workouts.reduce((s,w)=>s+(w.sets?.length||0),0)} sets</div>
  `;
};

/* ============================================================
   MODALS
   ============================================================ */
function modal(html){
  const m=document.createElement('div');m.className='modal-bg';
  m.innerHTML=`<div class="modal">${html}</div>`;
  document.body.appendChild(m);
  m.onclick=e=>{if(e.target===m)closeModal(m)};
  document.body.style.overflow='hidden';
  return m;
}
function closeModal(m){document.body.style.overflow='';m.remove()}
const numIn=(el,sel)=>{const v=el.querySelector(sel).value;return v===''?null:Number(v)};

function openWorkout(){
  if(!DB.exercises.filter(e=>!e.archived).length)return toast('Add an exercise first',true);
  const m=modal(`
    <h3>Log workout</h3>
    <div class="form-grid"><div class="field"><label>Title</label><input id="t" placeholder="Upper Body A" autofocus></div><div class="field"><label>Date</label><input id="d" type="date" value="${today()}"></div></div>
    <div class="field"><label>Feeling</label><div id="feel" style="display:flex;gap:6px">${[1,2,3,4,5].map(n=>`<button type="button" class="feel-btn" data-f="${n}" style="flex:1;padding:9px;border-radius:6px;background:var(--bg-2);border:1px solid var(--border);color:var(--text-3)">★</button>`).join('')}</div></div>
    <div class="field"><label>Sets</label><div id="sets"></div><button type="button" class="btn" id="addrow" style="width:100%;padding:9px;background:transparent;border:1px dashed var(--border-hi);color:var(--text-2);margin-top:8px">${IC.plus}Add set</button></div>
    <div class="modal-actions"><button class="btn ghost" onclick="closeModal(this.closest('.modal-bg'))">Cancel</button><button class="btn primary" id="s">Save</button></div>
  `);
  let feeling=0;
  m.querySelectorAll('.feel-btn').forEach(b=>{b.onclick=()=>{feeling=+b.dataset.f;m.querySelectorAll('.feel-btn').forEach(x=>{const a=+x.dataset.f<=feeling;x.style.background=a?'var(--red-soft)':'var(--bg-2)';x.style.borderColor=a?'var(--red-hi)':'var(--border)';x.style.color=a?'var(--red-hi)':'var(--text-3)'})}});
  const sets=m.querySelector('#sets');
  const updatePrevHint=r=>{
    const exId=+r.querySelector('.s-ex').value;const dateStr=m.querySelector('#d').value;
    const prevDate=T.previousSessionDate(exId,dateStr);const hint=r.querySelector('.prev-hint');
    if(!prevDate||!hint)return;
    const prevSets=T.setsOnDate(exId,prevDate);
    hint.textContent='prev: '+prevSets.map(s=>`${s.weight}×${s.reps}${s.rir!=null?'@'+s.rir:''}`).join(', ')+' ('+fmtDate(prevDate)+')';
  };
  const addRow=()=>{
    const r=document.createElement('div');r.className='set-row-edit';
    r.innerHTML=`<select class="s-ex">${DB.exercises.filter(e=>!e.archived).map(e=>`<option value="${e.id}">${esc(e.name)}</option>`).join('')}</select><input class="s-wt" type="number" step="0.5" placeholder="${wUnit()}"><input class="s-reps" type="number" placeholder="reps"><input class="s-rir" type="number" min="0" max="5" placeholder="RIR"><button type="button" class="set-rm" style="width:28px;height:28px;border-radius:4px;color:var(--text-3)">${IC.x}</button><div class="prev-hint" style="grid-column:1/-1;font-size:10px;color:var(--text-3);font-family:var(--mono);margin-top:2px"></div>`;
    r.querySelector('.set-rm').onclick=()=>r.remove();
    r.querySelector('.s-ex').onchange=()=>updatePrevHint(r);
    m.querySelector('#d').addEventListener('change',()=>updatePrevHint(r));
    updatePrevHint(r);
    sets.appendChild(r);
  };
  addRow();
  m.querySelector('#addrow').onclick=addRow;
  m.querySelector('#s').onclick=()=>{
    const title=m.querySelector('#t').value.trim();if(!title)return toast('Title required',true);
    const setsArr=[];
    for(const r of sets.children){
      const wt=+r.querySelector('.s-wt').value||0;const reps=+r.querySelector('.s-reps').value||0;
      const rirVal=r.querySelector('.s-rir').value;const rir=rirVal===''?null:parseInt(rirVal);
      if(wt||reps)setsArr.push({ex:+r.querySelector('.s-ex').value,reps,weight:wt,rir});
    }
    if(!setsArr.length)return toast('Add at least one set',true);
    DB.workouts.push({id:nid(),title,date:m.querySelector('#d').value,feeling:feeling||null,sets:setsArr,createdAt:Date.now()});
    persist();closeModal(m);toast('Saved');go('workouts');
  };
}

function viewWorkout(id){
  const w=DB.workouts.find(x=>x.id===id);if(!w)return;
  const groups={};
  for(const s of w.sets||[]){const ex=DB.exercises.find(e=>e.id===s.ex)||{name:'?'};(groups[s.ex]??={name:ex.name,id:s.ex,sets:[]}).sets.push(s)}
  modal(`
    <h3>${esc(w.title)}</h3>
    <div style="font-size:11px;color:var(--text-2);margin-bottom:12px">${fmtDate(w.date)} · ${(w.sets||[]).length} sets · ${Math.round(A.workoutVolume(w))} ${wUnit()}</div>
    ${Object.values(groups).map(g=>`<div style="margin-bottom:12px"><div style="font-weight:700;font-size:12px;margin-bottom:6px"><a href="#" onclick="event.preventDefault();this.closest('.modal-bg').remove();openExerciseDetail(${g.id})" style="color:var(--text)">${esc(g.name)}</a></div><div style="background:var(--bg-2);border-radius:6px;overflow:hidden">${g.sets.map((s,i)=>`<div style="display:flex;justify-content:space-between;padding:7px 10px;font-size:12px;border-bottom:1px solid var(--border)"><span style="color:var(--text-3)">Set ${i+1}</span><span class="mono">${s.weight||'—'}×${s.reps||'—'}${s.rir!=null?' @'+s.rir+' RIR':''}</span></div>`).join('')}</div></div>`).join('')}
    <div class="modal-actions"><button class="btn danger" onclick="if(confirm('Delete workout?')){DB.workouts=DB.workouts.filter(x=>x.id!==${w.id});persist();this.closest('.modal-bg').remove();views.workouts()}">Delete</button><button class="btn" onclick="this.closest('.modal-bg').remove()">Close</button></div>
  `);
}

function openExercise(){
  const m=modal(`<h3>New exercise</h3><div class="field"><label>Name</label><input id="n" autofocus></div><div class="form-grid"><div class="field"><label>Category</label><select id="c"><option>strength</option><option>cardio</option><option>mobility</option><option>other</option></select></div><div class="field"><label>Equipment</label><input id="eq" placeholder="Barbell"></div></div><div style="font-size:11px;color:var(--text-3);margin-bottom:12px">Muscle mapping auto-detected from name — editable after.</div><div class="modal-actions"><button class="btn ghost" onclick="this.closest('.modal-bg').remove()">Cancel</button><button class="btn primary" id="s">Add</button></div>`);
  m.querySelector('#s').onclick=()=>{
    const n=m.querySelector('#n').value.trim();if(!n)return toast('Name required',true);
    const mm=defaultMusclesFor(n);
    DB.exercises.push({id:nid(),name:n,category:m.querySelector('#c').value,equipment:m.querySelector('#eq').value.trim()||null,primaryMuscles:mm.primaryMuscles,secondaryMuscles:mm.secondaryMuscles,tertiaryMuscles:mm.tertiaryMuscles,createdAt:Date.now(),archived:false});
    persist();closeModal(m);toast('Added');views.exercises();
  };
}

function openBody(){
  const m=modal(`<h3>Log weight</h3><div class="form-grid"><div class="field"><label>Date</label><input id="d" type="date" value="${today()}"></div><div class="field"><label>Weight (${wUnit()})</label><input id="w" type="number" step="0.1"></div></div><div class="modal-actions"><button class="btn ghost" onclick="this.closest('.modal-bg').remove()">Cancel</button><button class="btn primary" id="s">Save</button></div>`);
  m.querySelector('#s').onclick=()=>{
    const d=m.querySelector('#d').value;const w=numIn(m,'#w');
    if(!d||w==null)return toast('Required',true);
    let rec=DB.body.find(x=>x.date===d);if(rec){rec.weight=w}else{DB.body.push({id:nid(),date:d,weight:w,createdAt:Date.now()})}
    persist();closeModal(m);toast('Saved');views.body();
  };
}

function openSleep(){
  const m=modal(`<h3>Log sleep</h3><div class="field"><label>Date (night of)</label><input id="d" type="date" value="${today()}"></div><div class="form-grid"><div class="field"><label>Bed</label><input id="bed" type="time" value="23:00"></div><div class="field"><label>Wake</label><input id="wake" type="time" value="07:00"></div></div><div class="field"><label>Quality</label><input id="q" type="number" min="1" max="10"></div><div class="modal-actions"><button class="btn ghost" onclick="this.closest('.modal-bg').remove()">Cancel</button><button class="btn primary" id="sv">Save</button></div>`);
  m.querySelector('#sv').onclick=()=>{
    const d=m.querySelector('#d').value;if(!d)return toast('Date required',true);
    let rec=(DB.sleep||[]).find(s=>s.date===d);if(!rec){rec={id:nid(),date:d,createdAt:Date.now()};DB.sleep.push(rec)}
    rec.bed=m.querySelector('#bed').value;rec.wake=m.querySelector('#wake').value;rec.duration=sleepDuration(rec);rec.quality=numIn(m,'#q');
    persist();closeModal(m);toast('Saved');views.sleep();
  };
}

function openGoal(){
  const m=modal(`<h3>New goal</h3><div class="field"><label>Title</label><input id="n" autofocus></div><div class="form-grid"><div class="field"><label>Type</label><select id="k"><option value="weight">Weight</option><option value="workout_count">Workouts</option><option value="custom">Custom</option></select></div><div class="field"><label>Target</label><input id="t" type="number" step="0.1"></div></div><div class="modal-actions"><button class="btn ghost" onclick="this.closest('.modal-bg').remove()">Cancel</button><button class="btn primary" id="s">Create</button></div>`);
  m.querySelector('#s').onclick=()=>{
    const n=m.querySelector('#n').value.trim();if(!n)return toast('Title required',true);
    DB.goals.push({id:nid(),title:n,kind:m.querySelector('#k').value,target:numIn(m,'#t'),status:'active',createdAt:Date.now()});
    persist();closeModal(m);toast('Created');views.goals();
  };
}

function saveSettings(){
  const s=DB.settings;
  s.weightUnit=document.getElementById('s-wu').value;
  s.weekStart=+document.getElementById('s-ws').value;
  s.proteinTarget=+document.getElementById('s-p').value||180;
  s.carbsTarget=+document.getElementById('s-cb').value||250;
  s.fatTarget=+document.getElementById('s-f').value||70;
  s.fiberTarget=+document.getElementById('s-fb').value||30;
  s.sleepTargetH=+document.getElementById('s-sl').value||8;
  s.stepTarget=+document.getElementById('s-st').value||8000;
  s.weeklyWorkoutTarget=+document.getElementById('s-ww').value||4;
  persist();toast('Saved');render();
}

function exportJSON(){
  const blob=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='forma-backup-'+today()+'.json';a.click();
  toast('Backup downloaded');
}
function importJSON(e){
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result);
      if(!d.exercises||!d.workouts)throw new Error('Invalid');
      d.settings={...DEFAULT_SETTINGS,...(d.settings||{})};
      d.sleep??=[];d.steps??=[];d.body??=[];d.goals??=[];d.meals??=[];d.dailyMacros??={};d.dailyNotes??={};
      normalizeExercises(d);DB=d;
      NEXT_ID=Math.max(0,...(DB.exercises||[]).map(x=>+x.id||0),...(DB.workouts||[]).map(x=>+x.id||0),...(DB.body||[]).map(x=>+x.id||0),...(DB.goals||[]).map(x=>+x.id||0),...(DB.sleep||[]).map(x=>+x.id||0),...(DB.steps||[]).map(x=>+x.id||0))+1;
      persist();toast('Imported');render();
    }catch{toast('Invalid file',true)}
  };
  r.readAsText(f);
}
function resetAll(){
  if(!confirm('Erase ALL data?'))return;
  if(!confirm('Really sure?'))return;
  localStorage.removeItem(KEY);location.reload();
}

render();
</script>
</body>
</html>
